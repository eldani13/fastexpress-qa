name: Reporte de defecto
description: El QA registra un defecto encontrado durante las pruebas
title: "[DEF-XXX] "
labels: ["tipo:defecto", "estado:nuevo"]
body:
  - type: markdown
    attributes:
      value: |
        Un buen reporte permite que otra persona reproduzca el defecto sin preguntarte nada.
        Título: qué falla y dónde, en una frase. Ejemplo: "[DEF-004] La API responde 500 con pesos de más de 28 dígitos".

  - type: dropdown
    id: modulo
    attributes:
      label: Módulo afectado
      description: Define a quién se asigna el defecto
      options:
        - Backend (lógica de negocio o API)
        - Frontend (interfaz)
        - Pruebas automatizadas
        - Documentación
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      description: "Impacto en el usuario. Ver docs/proceso/ciclo-de-vida-defectos.md"
      options:
        - Crítica - el sistema no se puede usar o calcula mal un valor a cobrar
        - Alta - falla una función o el usuario recibe información engañosa
        - Media - falla un contrato técnico o un caso poco frecuente
        - Baja - defecto estético o de redacción
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad propuesta
      options:
        - Alta - corregir antes de la siguiente entrega
        - Media - corregir en este ciclo
        - Baja - corregir cuando haya tiempo
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Windows 11, Chrome 141, Python 3.12, commit abc1234"
    validations:
      required: true

  - type: input
    id: caso
    attributes:
      label: Caso de prueba relacionado
      placeholder: "UI-05, BVA-10, test_DEF004_... o 'prueba exploratoria'"

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: Qué debería pasar según la regla de negocio o la especificación (cítala)
    validations:
      required: true

  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
      description: Qué pasa realmente. Copia mensajes y códigos exactos.
    validations:
      required: true

  - type: dropdown
    id: frecuencia
    attributes:
      label: Frecuencia
      options:
        - Siempre
        - Intermitente
        - Una sola vez
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Arrastra capturas, pega la salida de la consola o la respuesta HTTP.

  - type: textarea
    id: notas
    attributes:
      label: Notas para el desarrollador
      description: Opcional. Observaciones que ayuden a encontrar la causa, sin proponer la solución.
